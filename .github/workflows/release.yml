name: Validate and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-filter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install "homeassistant==2026.1.1" "ruff==0.14.10"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test numerical model and Home Assistant lifecycle
        run: python -m unittest discover -s tests -v
      - name: Build integration
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: price-spike-filter
          path: dist/*

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-spike-filter
          path: dist
      - name: Publish versioned HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/price_spike_filter/manifest.json"))["version"])')
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
          else
            gh release create "v${VERSION}" dist/* \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Price Spike Filter v${VERSION}" \
              --notes-file docs/release-notes.md --latest
          fi
